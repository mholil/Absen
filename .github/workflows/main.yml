name: Build React Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Build project React/Vite kamu jadi file web siap pakai
      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build || npx vite build

      # 2. Bungkus hasil build (folder dist atau build) ke Cordova
      - name: Setup Cordova & Copy Build Output
        run: |
          npm install -g cordova
          cordova create app com.absen.app AbsenApp
          cd app
          cordova platform add android
          rm -rf www/*
          
          # Copy folder hasil build React ke folder www Cordova
          if [ -d "../dist" ]; then
            cp -r ../dist/* www/
          elif [ -d "../build" ]; then
            cp -r ../build/* www/
          fi

          # Izinkan navigasi & jaringan
          sed -i '/<\/widget>/i \    <access origin="*" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="Scheme" value="http" />' config.xml

      # 3. Compile jadi file APK
      - name: Build APK
        run: |
          cd app
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
