name: Build Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Cordova & Inject Config
        run: |
          npm install -g cordova
          cordova create app com.absen.app AbsenApp
          cd app
          cordova platform add android
          rm -rf www/*
          
          # Copy seluruh file web ke folder www
          rsync -av --exclude='app' --exclude='.git' --exclude='.github' ../ www/
          
          # Jika index.html tidak ada di root tapi ada file html lain, rename ke index.html
          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              mv "$FIRST_HTML" www/index.html
            fi
          fi

          # Izinkan akses domain luar (CDNs/Google Fonts/Tailwind/Bootstrap)
          sed -i '/<\/widget>/i \    <access origin="*" />\n    <allow-navigation href="*" />\n    <preference name="Scheme" value="http" />' config.xml

      - name: Build APK
        run: |
          cd app
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
