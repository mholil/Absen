name: Build Web to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application (Vite)
        env:
          VITE_API_BASE_URL: ${{ secrets.BACKEND_API_URL || '' }}
        run: |
          npm install
          npm run build

      - name: Setup Cordova Android Project
        run: |
          npm install -g cordova
          cordova create app com.absen.app AbsenMI
          cd app
          cordova platform add android
          rm -rf www/*
          
          # Salin hasil kompilasi web (folder dist) ke folder www Cordova
          cp -r ../dist/* www/
          
          # Konfigurasi akses jaringan, HTTPS scheme untuk WebView kamera, dan navigasi
          sed -i '/<\/widget>/i \    <access origin="*" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="Scheme" value="https" />\n    <preference name="Hostname" value="localhost" />\n    <preference name="MixedContentMode" value="0" />\n    <preference name="AndroidInsecureFileModeEnabled" value="true" />' config.xml
          
          # Pastikan izin Kamera dan Internet terpasang di AndroidManifest.xml
          if [ -f platforms/android/app/src/main/AndroidManifest.xml ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' platforms/android/app/src/main/AndroidManifest.xml
          fi

      - name: Build APK
        run: |
          cd app
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbsenMI-Android-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
