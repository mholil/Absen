name: Build React Web to APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== PACKAGE ==="
          if [ -f package.json ]; then
            cat package.json
          else
            echo "ERROR: package.json tidak ditemukan!"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build React
        run: |
          npm run build

      - name: Check Build
        run: |
          if [ -d "dist" ]; then
            echo "Build ditemukan di dist/"
            ls -lah dist
          elif [ -d "build" ]; then
            echo "Build ditemukan di build/"
            ls -lah build
          else
            echo "ERROR: dist/ atau build/ tidak ditemukan!"
            exit 1
          fi

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Create Cordova App
        run: |
          cordova create app com.absen.app AbsenApp

      - name: Add Android
        working-directory: app
        run: |
          cordova platform add android

      - name: Copy React to Cordova
        run: |
          rm -rf app/www/*

          if [ -d "dist" ]; then
            cp -r dist/* app/www/
          elif [ -d "build" ]; then
            cp -r build/* app/www/
          else
            echo "Build React tidak ditemukan!"
            exit 1
          fi

      - name: Configure Network
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("config.xml")
          s = p.read_text()

          insert = '''
              <access origin="*" />
              <allow-navigation href="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
          '''

          if '<access origin="*"' not in s:
              s = s.replace('</widget>', insert + '\n</widget>')

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: app
        run: |
          cordova build android --debug --no-telemetry

      - name: Check APK
        run: |
          find app/platforms/android -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
