name: Build React Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build React/Vite
      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps || npm install --force
          npx vite build || npm run build || true

      # Setup Cordova & Buka Akses Internet Total
      - name: Setup Cordova & Add Network Permissions
        run: |
          npm install -g cordova
          cordova create app com.absen.app AbsenApp
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist || true
          rm -rf www/*
          
          # Copy hasil build React
          if [ -d "../dist" ]; then
            cp -r ../dist/* www/
          elif [ -d "../build" ]; then
            cp -r ../build/* www/
          else
            cp -r ../public/* www/ || true
          fi

          # Tambahkan izin Android Internet & Network Security Policy
          sed -i '/<\/widget>/i \    <access origin="*" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="Scheme" value="https" />\n    <preference name="Hostname" value="localhost" />\n    <preference name="android-targetSdkVersion" value="33" />' config.xml
          
          # Force Android Manifest Izinkan Internet & Cleartext Traffic
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' platforms/android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' platforms/android/app/src/main/AndroidManifest.xml

      # Compile ke APK
      - name: Build APK
        run: |
          cd app
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
