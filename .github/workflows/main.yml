name: Build Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Cordova & Copy Files
        run: |
          npm install -g cordova
          cordova create app com.absen.app AbsenApp
          cd app
          cordova platform add android
          rm -rf www/*
          
          # Copy seluruh file project ke folder www
          rsync -av --exclude='app' --exclude='.git' --exclude='.github' ../ www/
          
          # Izinkan navigasi lokal di Cordova config
          sed -i '/<\/widget>/i \    <access origin="*" />\n    <allow-navigation href="*" />' config.xml

      - name: Build APK
        run: |
          cd app
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
