name: Build Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Absen com.absen.app --web-dir .

      - name: Add Android & Sync
        run: |
          npx cap add android
          # Hapus folder github dari bundle android
          rm -rf android/app/src/main/assets/public/.github
          rm -rf android/app/src/main/assets/public/.git
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
