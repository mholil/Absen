name: Build Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Cordova Project
        run: |
          npm install -g cordova
          cordova create app com.absen.app AbsenApp
          cd app
          cordova platform add android
          rm -rf www/*
          
          # Copy file web ke folder www
          cp -r ../* www/ || true
          rm -rf www/app
          
          # Fix jika file bernama Index.html (kapital)
          if [ -f www/Index.html ]; then
            mv www/Index.html www/index.html
          fi

          # Izinkan akses jaringan/CDN & navigasi lokal
          sed -i '/<\/widget>/i \    <access origin="*" />\n    <allow-navigation href="*" />\n    <allow-intent href="*" />\n    <preference name="Scheme" value="http" />' config.xml

      - name: Build APK
        run: |
          cd app
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
