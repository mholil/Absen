name: Build Web to APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone Web2App Template
        run: |
          git clone https://github.com/anthonyneor/Android-WebView-App.git app_builder
          rm -rf app_builder/app/src/main/assets/*
          
          # Copy seluruh isi web kamu ke dalam folder assets WebView
          rsync -av --exclude='app_builder' --exclude='.git' --exclude='.github' ./ app_builder/app/src/main/assets/

      - name: Build APK
        run: |
          cd app_builder
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Absen-APK
          path: app_builder/app/build/outputs/apk/debug/app-debug.apk
